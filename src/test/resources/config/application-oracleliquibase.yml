# ===================================================================
# Oracle + Liquibase production-schema verification profile.
#
# Activate:
#   ./mvnw verify -Dskip.unit.tests=true -Poracle-liquibase-testcontainers
#
# Rules:
#   - Liquibase ON (full master.xml)
#   - Hibernate ddl-auto=none (no schema generation)
#   - No test-data.sql Hibernate init
# ===================================================================

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      auto-commit: false
      poolName: Hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      data-source-properties:
        # Avoid ORA-18716 when reading DATE/TIMESTAMP into Instant on ojdbc 21+.
        oracle.jdbc.timezoneAsRegion: false
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate.hbm2ddl.auto: none
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.query.fail_on_pagination_over_collection_fetch: true
  liquibase:
    enabled: true
    contexts: test
  sql:
    init:
      mode: never

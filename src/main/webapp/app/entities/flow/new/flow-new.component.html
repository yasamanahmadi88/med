<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <div class="d-flex">
        <h2 *ngIf="!productName" id="jhi-flow-heading" data-cy="FlowCreateUpdateHeading" jhiTranslate="medPortalApp.flow.home.createLabel">
          Create a Flow
        </h2>
        <div *ngIf="productName">
          <span style="font-size: 35px" jhiTranslate="medPortalApp.flow.home.createLabelFor"></span>
          <span style="font-weight: bold; font-size: 55px; color: teal">{{productName}}</span>
        </div>
      </div>

      <div style="margin-top: 60px">
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="medPortalApp.flow.flow" for="field_flow">Flow</label>
          <div class="d-flex" style="padding: 0">
            <button class="btn btn-success" style="max-height: 50px; width: 200px; align-self: center;" (click)="openBPMNPage()">
              <img src="../../../../content/images/bpmn-icon.svg" style="height: 40px; width: auto;">
              <span jhiTranslate="entity.action.edit" style="color: #FFF">Edit</span>
            </button>
            <textarea [value]="bpmnXml" type="textarea" class="form-control" name="flow" id="field_flow" data-cy="flow" disabled rows="4" style="margin-inline-start: 50px"></textarea>
          </div>
          <div
            *ngIf="editForm.get('flow')!.invalid && (editForm.get('flow')!.dirty || editForm.get('flow')!.touched)">
            <small class="form-text text-danger" *ngIf="editForm.get('flow')?.errors?.required"
                   jhiTranslate="entity.validation.required">
              This field is required.
            </small>
          </div>
        </div>

        <div class="row mb-3" *ngIf="bpmnXml != ''">
          <label class="form-label" jhiTranslate="medPortalApp.flow.flowName" for="field_flowName">Flow Name</label>
          <input type="text" class="form-control" name="flowName" id="field_flowName" data-cy="flowName" formControlName="flowName" />
          <div *ngIf="editForm.get('flowName')!.invalid && (editForm.get('flowName')!.dirty || editForm.get('flowName')!.touched)">
            <small
              class="form-text text-danger"
              *ngIf="editForm.get('flowName')?.errors?.required"
              jhiTranslate="entity.validation.required"
            >
              This field is required.
            </small>
            <small
              class="form-text text-danger"
              *ngIf="editForm.get('flowName')?.errors?.maxlength || editForm.get('flowName')?.errors?.minlength"
              jhiTranslate="entity.validation.minmaxlength"
              [translateValues]="{ length: 6 }"
            >
              This field must be 6 characters long.
            </small>
          </div>
        </div>

        <div class="row mb-3" *ngIf="bpmnXml != ''">
          <label class="form-label" jhiTranslate="medPortalApp.flow.flowDesc" for="field_flowDesc">Flow Desc</label>
          <input type="text" class="form-control" name="flowDesc" id="field_flowDesc" data-cy="flowDesc" formControlName="flowDesc" />
          <div *ngIf="editForm.get('flowDesc')!.invalid && (editForm.get('flowDesc')!.dirty || editForm.get('flowDesc')!.touched)">
            <small
              class="form-text text-danger"
              *ngIf="editForm.get('flowDesc')?.errors?.required"
              jhiTranslate="entity.validation.required"
            >
              This field is required.
            </small>
            <small
              class="form-text text-danger"
              *ngIf="editForm.get('flowDesc')?.errors?.maxlength"
              jhiTranslate="entity.validation.maxlength"
              [translateValues]="{ max: 300 }"
            >
              This field cannot be longer than 300 characters.
            </small>
          </div>
        </div>

        <div *ngIf="!productName">
          <div class="row mb-3" *ngIf="bpmnXml != ''">
            <label class="form-label" jhiTranslate="medPortalApp.flow.product" for="field_product">Product</label>
            <select
              class="form-control"
              id="field_product"
              data-cy="product"
              name="product"
              formControlName="product"
              [compareWith]="compareProduct"
            >
              <option *ngIf="editForm.get(['product'])!.value == null" [ngValue]="null" selected></option>
              <option [ngValue]="productOption"
                      *ngFor="let productOption of productsSharedCollection">{{ productOption.productName }}</option>
            </select>
          </div>
          <div
            *ngIf="editForm.get(['product'])!.invalid && (editForm.get(['product'])!.dirty || editForm.get(['product'])!.touched)">
            <small
              class="form-text text-danger"
              *ngIf="editForm.get(['product'])?.errors?.required"
              jhiTranslate="entity.validation.required"
            >
              This field is required.
            </small>
          </div>
        </div>

      </div>

      <hr style="margin-top: 80px"/>
      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>

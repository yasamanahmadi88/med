<div class="toolbar" role="toolbar" aria-label="BPMN editor toolbar">
  <div class="primary-actions" role="group" aria-label="Diagram actions">
    <button
      type="button"
      class="action-button save-button"
      [title]="canSave ? 'Save' : problemSummary"
      data-cy="bpmnSave"
      [disabled]="!canSave"
      (click)="onSave()"
    >
      Save
    </button>

    <button type="button" class="action-button preview-button" title="Preview as XML" data-cy="bpmnPreviewXml" (click)="onPreviewXml()">
      Preview as XML
    </button>

    <button type="button" class="action-button cancel-button" title="Cancel" data-cy="bpmnCancel" (click)="onCancel()">Cancel</button>
  </div>

  <div class="button-group" role="group" aria-label="Zoom controls">
    <button type="button" class="icon-button" title="Zoom Out" aria-label="Zoom Out" data-cy="bpmnZoomOut" (click)="zoomOut()">
      <fa-icon [icon]="icons.zoomOut"></fa-icon>
    </button>

    <button type="button" class="zoom-button" title="Zoom Reset" aria-label="Zoom Reset" data-cy="bpmnZoomFit" (click)="zoomToFit()">
      {{ zoomPercent }}%
    </button>

    <button type="button" class="icon-button" title="Zoom In" aria-label="Zoom In" data-cy="bpmnZoomIn" (click)="zoomIn()">
      <fa-icon [icon]="icons.zoomIn"></fa-icon>
    </button>
  </div>

  <div class="button-group" role="group" aria-label="History controls">
    <button type="button" class="icon-button" title="Undo" aria-label="Undo" data-cy="bpmnUndo" (click)="onUndo()">
      <fa-icon [icon]="icons.undo"></fa-icon>
    </button>

    <button type="button" class="icon-button" title="Redo" aria-label="Redo" data-cy="bpmnRedo" (click)="onRedo()">
      <fa-icon [icon]="icons.redo"></fa-icon>
    </button>

    <button type="button" class="icon-button" title="Erase Redo" aria-label="Erase Redo" data-cy="bpmnRestart" (click)="onRestart()">
      <fa-icon [icon]="icons.restart"></fa-icon>
    </button>
  </div>

  <div class="button-group utility-actions" role="group" aria-label="Editor tools">
    <button
      type="button"
      class="icon-button"
      title="toggleProcessMock"
      aria-label="toggleProcessMock"
      data-cy="bpmnToggleProcessMock"
      (click)="toggleProcessMock()"
    >
      <fa-icon [icon]="icons.processMock"></fa-icon>
    </button>

    <button type="button" class="icon-button" title="bpmnEvents" aria-label="bpmnEvents" data-cy="bpmnEvents" (click)="openBpmnEvents()">
      <fa-icon [icon]="icons.bpmnEvents"></fa-icon>
    </button>
    <button
      *ngIf="showMinimap"
      type="button"
      class="icon-button"
      title="toggleMiniMap"
      aria-label="toggleMiniMap"
      data-cy="bpmnToggleMinimap"
      (click)="onToggleMinimap()"
    >
      <fa-icon [icon]="icons.minimap"></fa-icon>
    </button>

    <button
      *ngIf="showShortcuts"
      type="button"
      class="icon-button"
      title="bpmnShortcutKeys"
      aria-label="bpmnShortcutKeys"
      data-cy="bpmnShortcuts"
      (click)="onShowShortcuts()"
    >
      <fa-icon [icon]="icons.shortcuts"></fa-icon>
    </button>
  </div>
</div>

<div *ngIf="!canSave" class="toolbar-problems" role="alert" data-cy="bpmnProblems">
  <fa-icon [icon]="icons.problem"></fa-icon>

  <span class="toolbar-problems-title">
    Saving is blocked by {{ problems.length }} invalid {{ problems.length === 1 ? 'property' : 'properties' }}:
  </span>

  <ul>
    <li *ngFor="let problem of problems">
      <strong>{{ problem.elementName }}</strong> &middot; {{ problem.fieldLabel }} &mdash; {{ problem.message }}
    </li>
  </ul>
</div>

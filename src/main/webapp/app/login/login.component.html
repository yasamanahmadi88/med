<section class="login-page py-5">
  <!-- Event nodes پرتعداد و در سرتاسر پسزمینه صفحه لاگین -->
  <div class="event-stream" aria-hidden="true">
    <svg class="event-node l2r" style="--top: 5%; --size: 35px; --dur: 35s; --delay: -2s" viewBox="0 0 120 104">
      <polygon points="30,2 90,2 118,52 90,102 30,102 2,52" />
    </svg>
    <svg class="event-node r2l" style="--top: 15%; --size: 65px; --dur: 45s; --delay: -8s" viewBox="0 0 120 104">
      <polygon points="30,2 90,2 118,52 90,102 30,102 2,52" />
    </svg>
    <svg class="event-node l2r" style="--top: 25%; --size: 45px; --dur: 38s; --delay: -4s" viewBox="0 0 120 104">
      <polygon points="30,2 90,2 118,52 90,102 30,102 2,52" />
    </svg>
    <svg class="event-node r2l" style="--top: 40%; --size: 80px; --dur: 55s; --delay: -12s" viewBox="0 0 120 104">
      <polygon points="30,2 90,2 118,52 90,102 30,102 2,52" />
    </svg>
    <svg class="event-node l2r" style="--top: 55%; --size: 30px; --dur: 30s; --delay: -6s" viewBox="0 0 120 104">
      <polygon points="30,2 90,2 118,52 90,102 30,102 2,52" />
    </svg>
    <svg class="event-node r2l" style="--top: 70%; --size: 55px; --dur: 42s; --delay: -10s" viewBox="0 0 120 104">
      <polygon points="30,2 90,2 118,52 90,102 30,102 2,52" />
    </svg>
    <svg class="event-node l2r" style="--top: 85%; --size: 50px; --dur: 48s; --delay: -15s" viewBox="0 0 120 104">
      <polygon points="30,2 90,2 118,52 90,102 30,102 2,52" />
    </svg>
  </div>

  <!-- Form wrapper -->
  <div class="login-form-wrapper">
    <div class="card login-card my-auto">
      <h2 class="text-center mb-4 text-white" jhiTranslate="login.title">Sign in</h2>

      <div class="alert alert-danger login-alert" *ngIf="authenticationError" jhiTranslate="login.messages.error.authentication">
        <strong>Failed to sign in!</strong> Please check your credentials and try again.
      </div>

      <form class="login-form" role="form" (ngSubmit)="login()" [formGroup]="loginForm">
        <!-- Username -->
        <div class="form-field mb-4">
          <label for="username" class="form-label" jhiTranslate="global.form.username.label">Username</label>
          <input
            type="text"
            class="form-control login-input"
            name="username"
            id="username"
            placeholder="{{ 'global.form.username.placeholder' | translate }}"
            formControlName="username"
            #username
          />
        </div>

        <!-- Password -->
        <div class="form-field mb-4">
          <label for="password" class="form-label" jhiTranslate="login.form.password">Password</label>
          <input
            type="password"
            class="form-control login-input"
            name="password"
            id="password"
            placeholder="{{ 'login.form.password.placeholder' | translate }}"
            formControlName="password"
          />
        </div>

        <!-- Captcha -->
        <div class="form-field mb-4">
          <label for="userCaptchaInput" class="form-label">Captcha Verification</label>
          <div class="captcha-box">
            <input
              placeholder="Enter code"
              autocomplete="off"
              type="text"
              id="userCaptchaInput"
              formControlName="userCaptchaInput"
              maxlength="6"
              class="form-control login-input captcha-input"
              (keydown)="loginWithEnterKey($event)"
              [disabled]="isLoading"
            />

            <div class="captcha-preview">
              <img *ngIf="captchaImageUrl && !isLoading" [src]="captchaImageUrl" alt="Captcha" class="captcha-image" />
            </div>

            <button type="button" class="captcha-refresh" (click)="reloadCaptcha()" title="Refresh Captcha" [disabled]="isLoading">
              ↻
            </button>
          </div>

          <div class="validation-message" *ngIf="loginForm.get('userCaptchaInput')?.invalid && loginForm.get('userCaptchaInput')?.touched">
            Please enter the 6-character code.
          </div>
        </div>

        <!-- Remember me -->
        <div class="login-options mb-4">
          <label class="remember-me" for="rememberMe">
            <input type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" />
            <span jhiTranslate="login.form.rememberme">Remember me</span>
          </label>
        </div>

        <!-- Submit -->
        <button type="submit" class="login-submit w-100" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="!isLoading" jhiTranslate="login.form.button">Sign in</span>
          <span *ngIf="isLoading" class="submit-loading">
            <span class="loading-icon">⟳</span>
            Signing in...
          </span>
        </button>
      </form>
    </div>
  </div>
</section>

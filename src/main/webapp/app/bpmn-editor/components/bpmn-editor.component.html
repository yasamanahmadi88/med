<div #designerContainer [ngClass]="containerClasses" id="designer-container">
  <jhi-toolbar *ngIf="showToolbar"></jhi-toolbar>

  <div class="main-content">
    <jhi-palette *ngIf="customPalette"></jhi-palette>

    <jhi-designer [xml]="processXml" (xmlUpdate)="onXmlUpdate($event)" (contextmenu)="onDesignerContextMenu($event)"> </jhi-designer>

    <jhi-module-panel *ngIf="customPanel"></jhi-module-panel>
    <jhi-panel *ngIf="!customPanel"></jhi-panel>
  </div>

  <jhi-settings [settings]="editorSettings" (settingsUpdate)="onSettingsUpdate($event)"> </jhi-settings>

  <jhi-context-menu></jhi-context-menu>
</div>

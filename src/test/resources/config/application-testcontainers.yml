# ===================================================================
# Oracle Testcontainers integration-test profile.
#
# Activate through Maven with:
#   ./mvnw verify -Poracle-testcontainers
#
# Schema strategy (aligned with H2 testdev ITs):
#   - Liquibase OFF for ITs: legacy jhi_authority (name PK) conflicts with
#     MedAuthorityEntity (numeric id) when Hibernate alters Liquibase tables.
#   - Hibernate ddl-auto=update builds/keeps entity schema across DirtiesContext
#     restarts (create-drop per class is too slow on Oracle Free).
#   - test-data.sql seeds authorities/resources after schema is ready.
# ===================================================================

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      auto-commit: false
      poolName: Hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate.hbm2ddl.auto: update
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.jdbc.time_zone: UTC
      hibernate.query.fail_on_pagination_over_collection_fetch: true
  liquibase:
    enabled: false
    contexts: test
  sql:
    init:
      mode: always
      continue-on-error: false
      data-locations: classpath:test-data.sql

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=LEGACY;NON_KEYWORDS=VALUE
    username: medportal
    password:
    driver-class-name: org.h2.Driver
    hikari:
      auto-commit: false
      poolName: Hikari
      maximum-pool-size: 1

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate.hbm2ddl.auto: none
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.jdbc.time_zone: UTC
      hibernate.query.fail_on_pagination_over_collection_fetch: true

  liquibase:
    enabled: false
    contexts: test

  sql:
    init:
      mode: always
      continue-on-error: false
      schema-locations: classpath:schema-test.sql
      data-locations: optional:classpath:test-data.sql

mediation:
  bpmn:
    parser:
      url: http://localhost:9999
      active: false

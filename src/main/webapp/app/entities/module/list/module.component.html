<div>
  <h2 id="page-heading" data-cy="ModuleHeading">
    <span jhiTranslate="medPortalApp.module.home.title">Modules</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading">
        <fa-icon icon="sync" [animation]="isLoading ? 'spin' : undefined"></fa-icon>
        <span jhiTranslate="medPortalApp.module.home.refreshListLabel">Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-module"
        [routerLink]="['/module/new']"
        *jhiHasPermission="['module', 'create']; op: 'OR'"
      >
        <fa-icon icon="plus"></fa-icon>
        <span jhiTranslate="medPortalApp.module.home.createLabel"> Create a new Module </span>
      </button>
    </div>
  </h2>

  <jhi-alert-error></jhi-alert-error>

  <jhi-alert></jhi-alert>

  <jhi-filter [filters]="filters"></jhi-filter>

  <div class="alert alert-warning" id="no-result" *ngIf="modules?.length === 0">
    <span jhiTranslate="medPortalApp.module.home.notFound">No Modules found</span>
  </div>

  <div class="table-responsive table-entities" id="entities" *ngIf="modules && modules.length > 0">
    <table class="table table-striped" aria-describedby="page-heading">
      <thead>
        <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" (sortChange)="navigateToWithComponentValues()">
          <th scope="col" jhiSortBy="moduleName">
            <div class="d-flex">
              <span jhiTranslate="medPortalApp.module.moduleName">Module Name</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="defaultPort">
            <div class="d-flex">
              <span jhiTranslate="medPortalApp.module.defaultPort">Default Port</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="redisKeyPrefix">
            <div class="d-flex">
              <span jhiTranslate="medPortalApp.module.redisKeyPrefix">Redis Key Prefix</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="status">
            <div class="d-flex">
              <span jhiTranslate="medPortalApp.module.status">Status</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="loggingMode">
            <div class="d-flex">
              <span jhiTranslate="medPortalApp.module.loggingMode">Logging Mode</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="loggingFilter">
            <div class="d-flex">
              <span jhiTranslate="medPortalApp.module.loggingFilter">Logging Filter</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="dnsName">
            <div class="d-flex">
              <span jhiTranslate="medPortalApp.module.dnsName">Dns Name</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let module of modules; trackBy: trackId" data-cy="entityTable">
          <td>{{ module.moduleName }}</td>
          <td>{{ module.defaultPort }}</td>
          <td>{{ module.redisKeyPrefix }}</td>
          <td *ngIf="module.status == 0" jhiTranslate="medPortalApp.module.active">Active</td>
          <td *ngIf="module.status == 1" jhiTranslate="medPortalApp.module.notActive">Not active</td>
          <td>{{ module.loggingMode }}</td>
          <td>
            <button type="submit" class="btn btn-sm" (click)="showLoggingFilterDialog(module.loggingFilter)">
              <fa-icon icon="eye"></fa-icon>
            </button>
          </td>
          <td>{{ module.dnsName }}</td>
          <td class="text-end">
            <div class="btn-group">
              <button
                type="submit"
                [routerLink]="['/config']"
                [queryParams]="{ 'filter[moduleId.in]': module.id }"
                class="btn goldenButton btn-sm"
                data-cy="filterOtherEntityButton"
              >
                <fa-icon [icon]="faCog"></fa-icon>
                <span
                  class="d-none d-md-inline"
                  jhiTranslate="entity.action.show"
                  [translateValues]="{ otherEntity: ('medPortalApp.module.configs' | translate) }"
                  >Show Config</span
                >
              </button>

              <button type="submit" [routerLink]="['./', module.id, 'view']" class="btn btn-info btn-sm" title="View">
                <fa-icon [icon]="faEye" style="color: white"></fa-icon>
              </button>

              <button
                type="submit"
                [routerLink]="['./', module.id, 'edit']"
                queryParamsHandling="merge"
                class="btn btn-primary btn-sm"
                title="Edit"
                *jhiHasPermission="['module', 'edit']; op: 'OR'"
              >
                <fa-icon [icon]="faPencil" style="color: white"></fa-icon>
              </button>

              <button
                type="submit"
                (click)="delete(module)"
                class="btn btn-danger btn-sm"
                data-cy="entityDeleteButton"
                *jhiHasPermission="['module', 'delete']; op: 'OR'"
              >
                <fa-icon [icon]="faTrash"></fa-icon>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="modules && modules.length > 0">
    <div class="d-flex justify-content-center">
      <jhi-item-count [params]="{ page: page, totalItems: totalItems, itemsPerPage: itemsPerPage }"></jhi-item-count>
    </div>

    <div class="d-flex justify-content-center">
      <ngb-pagination
        [collectionSize]="totalItems"
        [page]="page"
        [pageSize]="itemsPerPage"
        [maxSize]="5"
        [rotate]="true"
        [boundaryLinks]="true"
        (pageChange)="navigateToPage($event)"
      ></ngb-pagination>
    </div>
  </div>
</div>

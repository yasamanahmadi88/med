<div class="d-flex justify-content-center">
  <div class="col-8">
    <div *ngIf="medAuthority">
      <h2 data-cy="medAuthorityDetailsHeading"><span jhiTranslate="medPortalApp.medAuthority.detail.title">Med Authority</span></h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ medAuthority.id }}</span>
        </dd>
        <dt><span jhiTranslate="medPortalApp.medAuthority.name">Name</span></dt>
        <dd>
          <span>{{ medAuthority.name }}</span>
        </dd>
        <dt><span jhiTranslate="medPortalApp.medAuthority.displayName">Display Name</span></dt>
        <dd>
          <span>{{ medAuthority.displayName }}</span>
        </dd>
        <dt><span jhiTranslate="medPortalApp.medAuthority.parentId">Parent Id</span></dt>
        <dd>
          <span>{{ medAuthority.parentId }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/med-authority', medAuthority.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
  </div>
</div>

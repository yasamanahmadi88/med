<div class="app-root" [class.login-mode]="isLoginPage">
  <ng-container *ngIf="!isLoginPage">
    <router-outlet name="navbar"></router-outlet>
  </ng-container>

  <main [ngClass]="isLoginPage ? 'login-route-host' : fullScreen ? '' : 'container-fluid'">
    <div [ngClass]="isLoginPage ? '' : fullScreen ? 'card' : 'card jh-card'">
      <router-outlet></router-outlet>
    </div>

    <jhi-footer *ngIf="!fullScreen && !isLoginPage"></jhi-footer>
  </main>
</div>

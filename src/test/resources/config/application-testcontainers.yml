# ===================================================================
# Oracle Testcontainers integration-test profile.
#
# Activate through Maven with:
#   ./mvnw verify -Poracle-testcontainers
#
# The Oracle container is started by TestContainersSpringContextCustomizerFactory
# when Docker is available and an @EmbeddedSQL integration test runs.
# ===================================================================

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      auto-commit: false
      poolName: Hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    # Liquibase owns the schema on Oracle; do not let Hibernate create sequences/tables first
    # (that causes ORA-00955 when Liquibase runs createSequence sequence_generator).
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate.hbm2ddl.auto: none
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.jdbc.time_zone: UTC
      hibernate.query.fail_on_pagination_over_collection_fetch: true
  liquibase:
    enabled: true
    contexts: test
  sql:
    init:
      mode: never

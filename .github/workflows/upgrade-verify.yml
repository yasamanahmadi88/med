name: Upgrade verification

on:
  push:
    branches:
      - upgrade/angular21-java25-springboot-4.0.6
  pull_request:

permissions:
  contents: read

jobs:
  frontend-and-playwright:
    name: Angular lint, unit, prod build, Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx ng test --watch=false --coverage=false

      - run: npm run webapp:build:prod

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e:playwright

  maven-default:
    name: Java 25 Maven verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - run: ./mvnw -version

      - name: Modernizer
        run: ./mvnw -ntp -Dskip.installnodenpm -Dskip.npm -DskipTests modernizer:modernizer

      - name: Maven verify
        run: ./mvnw -ntp -Dskip.installnodenpm -Dskip.npm verify

  oracle-testcontainers:
    name: Oracle Testcontainers Maven verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - run: ./mvnw -version

      - name: Maven verify with Oracle Free Testcontainers
        env:
          TESTCONTAINERS_ORACLE_IMAGE: gvenzl/oracle-free:slim
        run: ./mvnw -ntp -Dskip.installnodenpm -Dskip.npm -Poracle-testcontainers verify

  docker-image:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: |
          if [ ! -f Dockerfile ]; then
            echo "No Dockerfile present; skipping image build"
            exit 0
          fi
          docker build -t medportal-upgrade-verify:${{ github.sha }} .

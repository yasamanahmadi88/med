# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
version: '3.8'
services:
  medportal-app:
    image: medportal
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:oracle:thin:@medportal-oracle:1521:MedPortal}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-medportal}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?set DB password}
      - SPRING_LIQUIBASE_URL=${SPRING_LIQUIBASE_URL:-jdbc:oracle:thin:@medportal-oracle:1521:MedPortal}
      # Required: export a 512-bit Base64 secret before `docker compose up`.
      - SECURITY_AUTHENTICATION_JWT_BASE64_SECRET=${SECURITY_AUTHENTICATION_JWT_BASE64_SECRET:?set JWT secret}
      - JHIPSTER_SLEEP=30 # gives time for other services to boot before the application
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 127.0.0.1:8080:8080

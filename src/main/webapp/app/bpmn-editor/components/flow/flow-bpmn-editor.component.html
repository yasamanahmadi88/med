<div *ngIf="accessError" class="alert alert-danger m-3" role="alert" data-cy="bpmnAccessError">
  {{ accessError }}
</div>
<div *ngIf="saveError" class="alert alert-danger m-3" role="alert" data-cy="bpmnSaveError">
  {{ saveError }}
</div>

<!-- The modeler is not created until Owner -> Group -> Element access has loaded successfully. -->
<jhi-bpmn-editor *ngIf="seeded && !accessError"></jhi-bpmn-editor>

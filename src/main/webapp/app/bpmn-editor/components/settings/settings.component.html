<div class="settings-container">
  <button type="button" class="settings-toggle" (click)="toggleSettings()" title="Settings" aria-label="Settings">
    <i class="fas fa-cog"></i>
  </button>

  <div class="settings-panel" *ngIf="showSettings && localSettings as currentSettings">
    <div class="settings-header">
      <h3>Settings</h3>
      <button type="button" class="close-btn" (click)="closeSettings()" aria-label="Close settings">×</button>
    </div>

    <div class="settings-content">
      <div class="setting-item">
        <label>Language:</label>
        <select [value]="currentSettings.language" (change)="onSelectChange('language', $event)">
          <option value="zh_CN">中文</option>
          <option value="en_US">English</option>
        </select>
      </div>

      <div class="setting-item">
        <label>Background:</label>
        <select [value]="currentSettings.bg" (change)="onSelectChange('bg', $event)">
          <option value="white">White</option>
          <option value="grid">Grid</option>
          <option value="grid-image">Grid Image</option>
          <option value="image">Image</option>
        </select>
      </div>

      <div class="setting-item">
        <label>
          <input type="checkbox" [checked]="currentSettings.toolbar" (change)="onCheckboxChange('toolbar', $event)" />
          Show Toolbar
        </label>
      </div>

      <div class="setting-item">
        <label>
          <input type="checkbox" [checked]="currentSettings.miniMap" (change)="onCheckboxChange('miniMap', $event)" />
          Show Mini Map
        </label>
      </div>
    </div>
  </div>
</div>

<div class="toolbar">
  <div class="toolbar-section">
    <button class="toolbar-btn" (click)="onSave()"><i class="fas fa-save"></i> Save</button>
    <button class="toolbar-btn" (click)="onExport()"><i class="fas fa-download"></i> Export</button>
    <button class="toolbar-btn" (click)="onImport()"><i class="fas fa-upload"></i> Import</button>
  </div>
  <div class="toolbar-section">
    <button class="toolbar-btn" (click)="onUndo()"><i class="fas fa-undo"></i> Undo</button>
    <button class="toolbar-btn" (click)="onRedo()"><i class="fas fa-redo"></i> Redo</button>
  </div>
</div>
